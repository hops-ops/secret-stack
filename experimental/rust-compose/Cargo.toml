[package]
name = "secret-stack-compose"
version = "0.1.0"
edition = "2021"
description = """
Experimental layered-gate composition for SecretStack.

Expresses the same render graph as functions/render/*.gotmpl using typed
Exists/Ready gates and under_exists layers (rusty alternative to go-templating).
Not yet wired into composition.yaml — prototype only.
"""
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1"
