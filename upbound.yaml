apiVersion: meta.dev.upbound.io/v2alpha1
kind: Project
metadata:
  name: secret-stack
spec:
  dependsOn:
  - apiVersion: pkg.crossplane.io/v1
    kind: Function
    package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
    version: '>=v0 <v1'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-helm
    version: '>=v1 <v2'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes
    version: '>=v1 <v2'
  - apiVersion: pkg.crossplane.io/v1
    kind: Configuration
    package: ghcr.io/hops-ops/aws-pod-identity
    version: '>=v0 <v1'
  description: |
    Installs external-secrets and wires a SecretStore to AWS Secrets Manager
    or HashiCorp Vault. Optional in-cluster Vault Helm install for local/dev.
  license: Apache-2.0
  maintainer: Patrick Lee Scott <pat@patscott.io>
  readme: |
    # secret-stack

    Platform SecretStack (hops.ops.com.ai): External Secrets Operator plus a
    backend-specific SecretStore (AWS Secrets Manager or Vault).
  repository: ghcr.io/hops-ops/secret-stack
  source: github.com/hops-ops/secret-stack
